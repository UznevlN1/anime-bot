<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ANIFILM_BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0b10;--bg-card:#15151d;--accent:#7c5cff;--accent-2:#a78bfa;--text:#f2f1f7;--text-dim:#9a98a8;--border:#23232f;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:72px;-webkit-tap-highlight-color:transparent;}
.topbar{display:flex;align-items:center;padding:14px 16px;position:sticky;top:0;background:rgba(11,11,16,.9);backdrop-filter:blur(8px);z-index:10;border-bottom:1px solid var(--border);}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;}
.brand-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#3d2b8f);display:flex;align-items:center;justify-content:center;font-size:14px;}
.view{display:none;padding:16px;}.view.active{display:block;}
.hero{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,#1a1430,#0d0c14 70%);padding:90px 18px 20px;margin-bottom:24px;min-height:200px;border:1px solid var(--border);}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 0%,rgba(124,92,255,.35),transparent 60%);}
.hero-badge{position:absolute;top:14px;left:14px;background:var(--accent);font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;}
.hero-title{position:relative;font-size:22px;font-weight:800;margin-bottom:4px;}
.hero-sub{position:relative;color:var(--text-dim);font-size:13px;margin-bottom:14px;}
.btn-primary{position:relative;background:var(--accent);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;}
.row{margin-bottom:24px;}.row-head{margin-bottom:12px;}.row-head h2{font-size:16px;font-weight:700;}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;}.hscroll::-webkit-scrollbar{display:none;}
.card{flex:0 0 120px;cursor:pointer;}
.card-img{width:120px;height:168px;border-radius:12px;object-fit:cover;background:var(--bg-card);border:1px solid var(--border);}
.card-title{font-size:12.5px;margin-top:6px;font-weight:600;}.card-sub{font-size:11px;color:var(--text-dim);}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}.grid .card{flex:none;width:100%;}.grid .card-img{width:100%;height:150px;}
.search-box{margin-bottom:14px;}.search-box input{width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:13px 14px;border-radius:12px;font-size:14px;}
.filter-chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;scrollbar-width:none;}.filter-chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:999px;font-size:12.5px;background:var(--bg-card);border:1px solid var(--border);color:var(--text-dim);}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.back-btn{background:none;border:none;color:var(--text);font-size:14px;margin-bottom:14px;}
.detail-poster{width:100%;height:230px;border-radius:16px;background:var(--bg-card);border:1px solid var(--border);background-size:cover;background-position:center;}
.detail-title{font-size:20px;font-weight:800;margin-top:14px;}.detail-meta{color:var(--text-dim);font-size:12.5px;margin:6px 0 12px;}
.detail-desc{font-size:13.5px;line-height:1.5;color:#cfcdda;margin-bottom:18px;}
.ep-head{font-size:15px;font-weight:700;margin-bottom:10px;}
.ep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ep-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:10px 0;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;}
.ep-btn.film-btn{grid-column:1/-1;padding:14px;font-size:15px;background:var(--accent);border-color:var(--accent);color:#fff;}
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(11,11,16,.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));}
.tab{flex:1;background:none;border:none;color:var(--text-dim);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab span{font-size:18px;}.tab.active{color:var(--accent-2);}
.empty-msg{color:var(--text-dim);text-align:center;padding:40px 0;font-size:13px;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-logo">案</span><span>ANIFILM_BOT</span></div>
</header>
<main id="view-home" class="view active">
  <section class="hero" id="heroCard">
    <div class="hero-badge">TREND</div>
    <h1 class="hero-title" id="heroTitle">Yuklanmoqda...</h1>
    <p class="hero-sub" id="heroSub"></p>
    <button class="btn-primary" id="heroPlay">Tomosha qilish ▸</button>
  </section>
  <section class="row"><div class="row-head"><h2>Davom etishda</h2></div><div class="hscroll" id="continueRow"></div></section>
  <section class="row"><div class="row-head"><h2>Barcha animelar</h2></div><div class="grid" id="allGrid"></div></section>
</main>
<main id="view-search" class="view">
  <div class="search-box"><input type="text" id="searchInput" placeholder="Anime nomini kiriting..."></div>
  <div class="filter-chips" id="genreChips"></div>
  <div class="grid" id="searchGrid"></div>
</main>
<main id="view-detail" class="view">
  <button class="back-btn" id="detailBack">← Orqaga</button>
  <div class="detail-poster" id="detailPoster"></div>
  <h1 class="detail-title" id="detailTitle"></h1>
  <div class="detail-meta" id="detailMeta"></div>
  <p class="detail-desc" id="detailDesc"></p>
  <h3 class="ep-head">Epizodlar</h3>
  <div class="ep-grid" id="epGrid"></div>
</main>
<nav class="tabbar">
  <button class="tab active" data-view="home"><span>⌂</span>Asosiy</button>
  <button class="tab" data-view="search"><span>⌕</span>Qidiruv</button>
</nav>
<script>
const tg=window.Telegram?.WebApp;
if(tg){tg.ready();tg.expand();tg.setHeaderColor('#0b0b10');tg.setBackgroundColor('#0b0b10');}
const API='/api';
let ALL_ANIME=[];
function placeholderImg(t){return`https://placehold.co/300x420/15151d/7c5cff?text=${encodeURIComponent(t||'Anime')}`;}
function posterUrl(a){return a.photo_id?`${API}/photo/${a.photo_id}`:placeholderImg(a.title);}
async function fetchJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json();}
function showView(n){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById('view-'+n).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===n));}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>showView(b.dataset.view)));
document.getElementById('detailBack').addEventListener('click',()=>showView('home'));
function renderCard(a){const d=document.createElement('div');d.className='card';d.innerHTML=`<img class="card-img" src="${posterUrl(a)}" alt="${a.title}"><div class="card-title">${a.title}</div><div class="card-sub">${a.episode_count||0}-epizod</div>`;d.addEventListener('click',()=>openDetail(a.id));return d;}
function renderHome(list){const f=list[0];if(f){document.getElementById('heroTitle').textContent=f.title;document.getElementById('heroSub').textContent=`${f.episode_count||0}-epizod • ${f.genre||''}`;const hc=document.getElementById('heroCard');hc.style.backgroundImage=`linear-gradient(160deg,rgba(13,12,20,.4),#0d0c14 85%),url(${posterUrl(f)})`;hc.style.backgroundSize='cover';hc.style.backgroundPosition='center';document.getElementById('heroPlay').onclick=()=>openDetail(f.id);}
const cr=document.getElementById('continueRow');cr.innerHTML='';list.slice(0,6).forEach(a=>cr.appendChild(renderCard(a)));
const ag=document.getElementById('allGrid');ag.innerHTML='';if(!list.length){ag.innerHTML='<div class="empty-msg">Hozircha anime qoshilmagan</div>';}else{list.forEach(a=>ag.appendChild(renderCard(a)));}}
function renderSearch(list){const g=document.getElementById('searchGrid');g.innerHTML='';if(!list.length){g.innerHTML='<div class="empty-msg">Hech narsa topilmadi</div>';return;}list.forEach(a=>g.appendChild(renderCard(a)));}
document.getElementById('searchInput').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();renderSearch(q?ALL_ANIME.filter(a=>a.title.toLowerCase().includes(q)):ALL_ANIME);});
function renderGenreChips(list){const genres=['Barchasi',...new Set(list.map(a=>a.genre).filter(Boolean))];const wrap=document.getElementById('genreChips');wrap.innerHTML='';genres.forEach((g,i)=>{const c=document.createElement('button');c.className='chip'+(i===0?' active':'');c.textContent=g;c.addEventListener('click',()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active');renderSearch(g==='Barchasi'?ALL_ANIME:ALL_ANIME.filter(a=>a.genre===g));});wrap.appendChild(c);});}
async function openDetail(id){showView('detail');document.getElementById('detailTitle').textContent='Yuklanmoqda...';document.getElementById('epGrid').innerHTML='';
try{const d=await fetchJSON(`${API}/animes/${id}`);
document.getElementById('detailPoster').style.backgroundImage=`url(${posterUrl(d)})`;
document.getElementById('detailPoster').style.backgroundSize='cover';
document.getElementById('detailPoster').style.backgroundPosition='center';
document.getElementById('detailTitle').textContent=d.title;
document.getElementById('detailMeta').textContent=`${d.genre||''} • ${d.year||''} • ${d.episodes?.length||0} epizod`;
document.getElementById('detailDesc').textContent=d.description||'';
const eg=document.getElementById('epGrid');eg.innerHTML='';
if(d.media_type==='film'){const ep=d.episodes?.[0];if(ep){const b=document.createElement('button');b.className='ep-btn film-btn';b.textContent='▶ Tomosha qilish';b.addEventListener('click',()=>sendEp(ep.id));eg.appendChild(b);}}
else{(d.episodes||[]).forEach(ep=>{const b=document.createElement('button');b.className='ep-btn';b.textContent=ep.episode_number+'-qism';b.addEventListener('click',()=>sendEp(ep.id));eg.appendChild(b);});}
}catch(e){document.getElementById('detailTitle').textContent='Xatolik yuz berdi';}}
function sendEp(eid){
  const uid=tg?.initDataUnsafe?.user?.id;
  if(!uid){tg?.openTelegramLink('https://t.me/ANIFILM_BOT?start=ep_'+eid);tg?.close();return;}
  fetch(API+'/send_episode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,episode_id:eid})})
  .then(r=>r.json()).then(d=>{if(d.ok){tg?.close();}else{const msg='Xatolik: '+(d.error||'nomalum');if(tg?.showAlert){tg.showAlert(msg);}else{alert(msg);}}})
  .catch(err=>{const msg='Tarmoq xatosi: '+err.message;if(tg?.showAlert){tg.showAlert(msg);}else{alert(msg);}});
}
async function init(){try{ALL_ANIME=await fetchJSON(`${API}/animes`);renderHome(ALL_ANIME);renderSearch(ALL_ANIME);renderGenreChips(ALL_ANIME);}catch(e){document.getElementById('heroTitle').textContent='Malumot yuklanmadi';}}
init();
</script>
</body>
</html>
