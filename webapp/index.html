<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ANIFILM BOT</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0a0f;
  --bg-card:#15151f;
  --bg-card2:#1b1b28;
  --border:#242432;
  --purple:#7c5cff;
  --purple2:#a78bfa;
  --text:#f5f5fa;
  --text-dim:#8b8b9c;
  --gold:#f5c542;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:78px;}
img{-webkit-user-drag:none;}
button{font-family:inherit;cursor:pointer;}

/* Topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 10px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-icon{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--purple),#5b3ff0);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.3px;}
.bell{width:38px;height:38px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text);position:relative;}
.bell .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--purple2);}

/* Search + segmented tabs */
.search-wrap{padding:4px 18px 12px;}
.search-box{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;color:var(--text-dim);font-size:14px;}
.search-box input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;}
.segmented{display:flex;gap:8px;padding:0 18px 6px;}
.seg-btn{flex:1;padding:11px 0;border-radius:12px;border:1px solid var(--border);background:var(--bg-card);color:var(--text-dim);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;}
.seg-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;}

/* Hero */
.hero-wrap{padding:14px 18px 0;}
.hero{position:relative;border-radius:20px;overflow:hidden;height:230px;background:#111;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;}
.hero-badge{align-self:flex-start;background:var(--purple);color:#fff;font-size:10px;font-weight:800;letter-spacing:.5px;padding:5px 10px;border-radius:8px;margin-bottom:auto;}
.hero-title{font-size:21px;font-weight:800;margin-bottom:4px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
.hero-sub{font-size:12px;color:#d8d8e4;margin-bottom:12px;}
.hero-actions{display:flex;gap:10px;}
.btn-primary{background:var(--purple);color:#fff;border:none;border-radius:11px;padding:11px 18px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.btn-ghost{background:rgba(255,255,255,.1);backdrop-filter:blur(6px);color:#fff;border:1px solid rgba(255,255,255,.18);border-radius:11px;padding:11px 14px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;}
.hero-dots{display:flex;justify-content:center;gap:6px;padding:12px 0 2px;}
.hero-dot{width:6px;height:6px;border-radius:50%;background:var(--border);}
.hero-dot.active{width:16px;background:var(--purple);}

/* Sections */
.section{padding:22px 18px 0;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.section-title{font-size:16px;font-weight:800;}
.section-link{font-size:12px;color:var(--purple2);font-weight:700;}
.row-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.row-scroll::-webkit-scrollbar{display:none;}

.card{width:128px;flex:none;}
.card-img-wrap{position:relative;width:128px;height:176px;border-radius:14px;overflow:hidden;background:var(--bg-card);}
.card-img{width:100%;height:100%;object-fit:cover;display:block;}
.card-title{font-size:12.5px;font-weight:700;margin-top:8px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.card-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}

.badge-new{position:absolute;top:8px;left:8px;background:var(--purple);color:#fff;font-size:9px;font-weight:800;letter-spacing:.4px;padding:3px 7px;border-radius:6px;}
.play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%);}
.play-circle{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;color:#111;font-size:13px;}

.rank-badge{position:absolute;top:8px;left:8px;width:24px;height:24px;border-radius:8px;background:var(--bg-card2);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);}
.rank-badge.r1{background:var(--purple);}
.rank-badge.r2{background:#8b8b9c;color:#0a0a0f;}
.rank-badge.r3{background:#e08a3c;color:#0a0a0f;}
.card-stats{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-dim);margin-top:2px;}

.fav-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:rgba(10,10,15,.55);backdrop-filter:blur(4px);border:none;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;}
.fav-btn.active{color:#ff5c7a;}

/* Grid (all animes / search results) */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.grid .card{width:100%;}
.grid .card-img-wrap{width:100%;height:0;padding-bottom:140%;}
.grid .card-img-wrap img{position:absolute;inset:0;}

.empty-msg{color:var(--text-dim);text-align:center;padding:40px 0;font-size:13px;}

/* Views */
.view{display:none;}
.view.active{display:block;}

/* Detail */
.detail-hero{position:relative;height:340px;background:#111;}
.detail-hero img{width:100%;height:100%;object-fit:cover;}
.detail-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,15,0) 40%,var(--bg) 96%);}
.detail-back{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(10,10,15,.55);backdrop-filter:blur(6px);border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:2;}
.detail-fav{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;background:rgba(10,10,15,.55);backdrop-filter:blur(6px);border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;z-index:2;}
.detail-fav.active{color:#ff5c7a;}
.detail-body{padding:0 18px;margin-top:-56px;position:relative;z-index:1;}
.detail-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.detail-meta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;}
.detail-desc{font-size:13px;line-height:1.6;color:#c9c9d6;margin-bottom:18px;}
.ep-head{font-size:15px;font-weight:800;margin-bottom:12px;padding:0 18px;}
.ep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 18px 24px;}
.ep-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:12px 0;border-radius:11px;font-size:13px;font-weight:700;text-align:center;}
.ep-btn:active{background:var(--purple);border-color:var(--purple);}

/* Block screens (maintenance / subscribe) */
.block-screen{padding-top:100px;text-align:center;}
.block-icon{font-size:52px;margin-bottom:18px;}
.block-title{font-size:16px;font-weight:800;margin-bottom:8px;padding:0 20px;}
.block-sub{font-size:13px;color:var(--text-dim);padding:0 24px;margin-bottom:20px;}
.sub-channels{display:flex;flex-direction:column;gap:10px;padding:0 20px;margin-bottom:20px;}
.sub-channel-btn{background:var(--bg-card);border:1px solid var(--border);color:var(--text);padding:13px;border-radius:12px;font-size:14px;font-weight:600;text-align:left;}
.sub-check-btn{margin:0 20px;width:calc(100% - 40px);justify-content:center;}

/* Profil */
.profil-wrap{padding:32px 18px;text-align:center;}
.profil-avatar{width:88px;height:88px;border-radius:50%;background:var(--bg-card2);margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:var(--purple2);overflow:hidden;border:2px solid var(--border);}
.profil-avatar img{width:100%;height:100%;object-fit:cover;}
.profil-name{font-size:17px;font-weight:800;margin-bottom:2px;}
.profil-username{font-size:13px;color:var(--text-dim);margin-bottom:24px;}
.profil-stats{display:flex;gap:10px;margin-bottom:24px;}
.profil-stat{flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:16px 8px;}
.profil-stat b{display:block;font-size:18px;font-weight:800;}
.profil-stat span{font-size:11px;color:var(--text-dim);}
.profil-link{display:flex;align-items:center;gap:12px;background:var(--bg-card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;font-size:13.5px;font-weight:700;margin-bottom:10px;}

/* Tabbar */
.tabbar{position:fixed;bottom:0;left:0;right:0;background:rgba(12,12,18,.92);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;padding:10px 0 max(10px,env(safe-area-inset-bottom));z-index:10;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--text-dim);font-size:10.5px;font-weight:700;}
.tab .tab-icon{font-size:19px;}
.tab.active{color:var(--purple2);}
</style>
</head>
<body>

<main id="view-home" class="view active">
  <div class="topbar">
    <div class="brand"><div class="brand-icon">A</div><div class="brand-name">ANIFILM BOT</div></div>
    <button class="bell" id="bellBtn">🔔<span class="dot"></span></button>
  </div>

  <div class="search-wrap">
    <div class="search-box">🔍<input id="searchInput" placeholder="Nomi bo'yicha qidirish..."></div>
  </div>
  <div class="segmented" id="segmented">
    <button class="seg-btn active" data-type="all">▦ Barchasi</button>
    <button class="seg-btn" data-type="film">🎬 Film</button>
    <button class="seg-btn" data-type="serial">📺 Serial</button>
  </div>

  <div id="heroSection" class="hero-wrap">
    <div class="hero" id="heroCard">
      <div class="hero-badge" id="heroBadge">TRENDING</div>
      <div class="hero-title" id="heroTitle">Yuklanmoqda...</div>
      <div class="hero-sub" id="heroSub"></div>
      <div class="hero-actions">
        <button class="btn-primary" id="heroPlay">▶ Tomosha qilish</button>
        <button class="btn-ghost" id="heroInfo">ⓘ Batafsil</button>
      </div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>

  <div class="section" id="continueSection" style="display:none;">
    <div class="section-head"><div class="section-title">Davom etishda</div></div>
    <div class="row-scroll" id="continueRow"></div>
  </div>

  <div class="section" id="newSection">
    <div class="section-head"><div class="section-title">Yangi qo'shilganlar</div></div>
    <div class="row-scroll" id="newRow"></div>
  </div>

  <div class="section" id="popularSection">
    <div class="section-head"><div class="section-title">Mashhur</div></div>
    <div class="row-scroll" id="popularRow"></div>
  </div>

  <div class="section" id="allSection">
    <div class="section-head"><div class="section-title" id="allSectionTitle">Barchasi</div></div>
    <div class="grid" id="allGrid"></div>
  </div>
</main>

<main id="view-favorites" class="view">
  <div class="topbar"><div class="brand-name" style="font-size:18px;">Sevimlilar</div></div>
  <div class="section" style="padding-top:6px;">
    <div class="grid" id="favGrid"></div>
  </div>
</main>

<main id="view-profil" class="view">
  <div class="profil-wrap">
    <div class="profil-avatar" id="profilAvatar">?</div>
    <div class="profil-name" id="profilName">Foydalanuvchi</div>
    <div class="profil-username" id="profilUsername"></div>
    <div class="profil-stats">
      <div class="profil-stat"><b id="statFav">0</b><span>Sevimli</span></div>
      <div class="profil-stat"><b id="statWatched">0</b><span>Ko'rilgan</span></div>
    </div>
    <button class="profil-link" id="profilBotLink">🤖 &nbsp; Botga o'tish</button>
    <button class="profil-link" id="profilClearHistory">🗑️ &nbsp; Tarixni tozalash</button>
  </div>
</main>

<main id="view-detail" class="view">
  <div class="detail-hero">
    <img id="detailImg" src="" alt="">
    <button class="detail-back" id="detailBack">←</button>
    <button class="detail-fav" id="detailFav">♡</button>
  </div>
  <div class="detail-body">
    <div class="detail-title" id="detailTitle"></div>
    <div class="detail-meta" id="detailMeta"></div>
    <div class="detail-desc" id="detailDesc"></div>
  </div>
  <h3 class="ep-head">Epizodlar</h3>
  <div class="ep-grid" id="epGrid"></div>
</main>

<main id="view-maintenance" class="view">
  <div class="block-screen">
    <div class="block-icon">🔧</div>
    <div class="block-title">Texnik ishlar olib borilmoqda</div>
    <div class="block-sub">Iltimos, birozdan so'ng qayta urinib ko'ring</div>
    <button class="btn-primary sub-check-btn" id="maintenanceRetry">🔄 Qayta urinish</button>
  </div>
</main>

<main id="view-subscribe" class="view">
  <div class="block-screen">
    <div class="block-icon">📢</div>
    <div class="block-title">Botdan foydalanish uchun quyidagi kanallarga obuna bo'ling</div>
    <div class="sub-channels" id="subChannels"></div>
    <button class="btn-primary sub-check-btn" id="subCheckBtn">✅ Obuna bo'ldim</button>
  </div>
</main>

<nav class="tabbar">
  <button class="tab active" data-view="home"><span class="tab-icon">🏠</span>Asosiy</button>
  <button class="tab" data-view="favorites"><span class="tab-icon">♡</span>Sevimlilar</button>
  <button class="tab" data-view="profil"><span class="tab-icon">👤</span>Profil</button>
</nav>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
const API='/api';
let ALL_ANIME=[];
let ACTIVE_TYPE='all';
let heroList=[]; let heroIdx=0; let heroTimer=null;

/* ---------- storage helpers (client-side, this device only) ---------- */
function favIds(){try{return JSON.parse(localStorage.getItem('anifilm_favs')||'[]');}catch(e){return [];}}
function setFavIds(arr){localStorage.setItem('anifilm_favs',JSON.stringify(arr));}
function isFav(id){return favIds().includes(id);}
function toggleFav(id){let f=favIds();f=f.includes(id)?f.filter(x=>x!==id):[...f,id];setFavIds(f);return f.includes(id);}
function historyIds(){try{return JSON.parse(localStorage.getItem('anifilm_history')||'[]');}catch(e){return [];}}
function pushHistory(id){let h=historyIds().filter(x=>x!==id);h.unshift(id);localStorage.setItem('anifilm_history',JSON.stringify(h.slice(0,15)));}

function formatViews(n){n=n||0;if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return String(n);}
function placeholderImg(t){return`https://placehold.co/300x420/15151d/7c5cff?text=${encodeURIComponent(t||'Anime')}`;}
function posterUrl(a){return a.photo_id?`${API}/photo/${a.photo_id}`:placeholderImg(a.title);}
async function fetchJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(r.status);return r.json();}
function getUid(){return tg?.initDataUnsafe?.user?.id||0;}

function showView(n){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+n).classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===n));
  window.scrollTo(0,0);
}

/* ---------- cards ---------- */
function favBtn(a){
  return `<button class="fav-btn ${isFav(a.id)?'active':''}" data-favtoggle="${a.id}">${isFav(a.id)?'♥':'♡'}</button>`;
}
function renderCard(a,variant){
  const d=document.createElement('div');d.className='card';
  const typeLabel=a.media_type==='film'?'Film':'Serial';
  let inner=`<div class="card-img-wrap"><img class="card-img" src="${posterUrl(a)}" alt="${a.title}">`;
  if(variant==='continue'){inner+=`<div class="play-overlay"><div class="play-circle">▶</div></div>`;}
  if(variant==='new'){inner+=`<div class="badge-new">NEW</div>`;}
  if(variant&&variant.rank){
    const r=variant.rank;const cls=r===1?'r1':r===2?'r2':r===3?'r3':'';
    inner+=`<div class="rank-badge ${cls}">${r}</div>`;
  }
  inner+=favBtn(a)+`</div>`;
  let sub='';
  if(variant&&variant.rank){
    sub=`<div class="card-stats">👁 ${formatViews(a.views)}</div>`;
  }else if(variant==='new'){
    sub=`<div class="card-sub">${typeLabel} • ${a.year||''}</div>`;
  }else{
    sub=`<div class="card-sub">${a.episode_count||0}-epizod</div>`;
  }
  d.innerHTML=inner+`<div class="card-title">${a.title}</div>`+sub;
  d.querySelector('.card-img-wrap').addEventListener('click',()=>openDetail(a.id));
  d.querySelector('.card-title').addEventListener('click',()=>openDetail(a.id));
  const fb=d.querySelector('[data-favtoggle]');
  fb.addEventListener('click',(e)=>{e.stopPropagation();const active=toggleFav(a.id);fb.classList.toggle('active',active);fb.textContent=active?'♥':'♡';if(document.getElementById('view-favorites').classList.contains('active'))renderFavorites();});
  return d;
}

/* ---------- hero carousel ---------- */
function renderHero(list){
  heroList=[...list].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,5);
  heroIdx=0;
  if(!heroList.length){document.getElementById('heroSection').style.display='none';return;}
  document.getElementById('heroSection').style.display='';
  const dots=document.getElementById('heroDots');dots.innerHTML='';
  heroList.forEach((_,i)=>{const dd=document.createElement('div');dd.className='hero-dot'+(i===0?' active':'');dots.appendChild(dd);});
  paintHero();
  if(heroTimer)clearInterval(heroTimer);
  if(heroList.length>1)heroTimer=setInterval(()=>{heroIdx=(heroIdx+1)%heroList.length;paintHero();},5000);
}
function paintHero(){
  const f=heroList[heroIdx];if(!f)return;
  document.getElementById('heroTitle').textContent=f.title;
  const typeLabel=f.media_type==='film'?'Film':`${f.episode_count||0}-epizod`;
  document.getElementById('heroSub').textContent=`${typeLabel} • ${f.year||''} • ${f.genre||''}`;
  const hc=document.getElementById('heroCard');
  hc.style.backgroundImage=`linear-gradient(160deg,rgba(10,10,15,.15),#0a0a0f 92%),url(${posterUrl(f)})`;
  hc.style.backgroundSize='cover';hc.style.backgroundPosition='center';
  document.getElementById('heroPlay').onclick=()=>openDetail(f.id);
  document.getElementById('heroInfo').onclick=()=>openDetail(f.id);
  document.querySelectorAll('.hero-dot').forEach((d,i)=>d.classList.toggle('active',i===heroIdx));
}

/* ---------- rows ---------- */
function renderRow(elId,list,variantFn){
  const el=document.getElementById(elId);el.innerHTML='';
  list.forEach((a,i)=>el.appendChild(renderCard(a,variantFn?variantFn(a,i):null)));
}
function renderContinue(){
  const hist=historyIds();
  const items=hist.map(id=>ALL_ANIME.find(a=>a.id===id)).filter(Boolean).slice(0,8);
  const sec=document.getElementById('continueSection');
  if(!items.length){sec.style.display='none';return;}
  sec.style.display='';
  renderRow('continueRow',items,()=>'continue');
}
function renderNewArrivals(){
  const items=[...ALL_ANIME].sort((a,b)=>b.id-a.id).slice(0,8);
  renderRow('newRow',items,()=>'new');
}
function renderPopular(){
  const items=[...ALL_ANIME].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,8);
  renderRow('popularRow',items,(a,i)=>({rank:i+1}));
}
function renderAllGrid(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  let items=ALL_ANIME;
  if(ACTIVE_TYPE!=='all')items=items.filter(a=>a.media_type===ACTIVE_TYPE);
  if(q)items=items.filter(a=>a.title.toLowerCase().includes(q));
  document.getElementById('allSectionTitle').textContent=q?`"${q}" bo'yicha natijalar`:'Barchasi';
  const isFiltering=q||ACTIVE_TYPE!=='all';
  document.getElementById('heroSection').style.display=isFiltering?'none':(heroList.length?'':'none');
  document.getElementById('continueSection').style.display=isFiltering?'none':(historyIds().length?'':'none');
  document.getElementById('newSection').style.display=isFiltering?'none':'';
  document.getElementById('popularSection').style.display=isFiltering?'none':'';
  const g=document.getElementById('allGrid');g.innerHTML='';
  if(!items.length){g.innerHTML='<div class="empty-msg">Hech narsa topilmadi</div>';return;}
  items.forEach(a=>g.appendChild(renderCard(a)));
}
function renderHome(list){renderHero(list);renderNewArrivals();renderPopular();renderContinue();renderAllGrid();}

/* ---------- favorites tab ---------- */
function renderFavorites(){
  const ids=favIds();
  const items=ids.map(id=>ALL_ANIME.find(a=>a.id===id)).filter(Boolean);
  const g=document.getElementById('favGrid');g.innerHTML='';
  if(!items.length){g.innerHTML='<div class="empty-msg">Hali sevimlilar yoʻq.<br>Anime ustidagi ♡ tugmasini bosing.</div>';return;}
  items.forEach(a=>g.appendChild(renderCard(a)));
}

/* ---------- profil tab ---------- */
function renderProfil(){
  const u=tg?.initDataUnsafe?.user;
  const av=document.getElementById('profilAvatar');
  if(u?.photo_url){av.innerHTML=`<img src="${u.photo_url}">`;}
  else{av.textContent=(u?.first_name||'?').charAt(0).toUpperCase();}
  document.getElementById('profilName').textContent=u?[u.first_name,u.last_name].filter(Boolean).join(' '):'Foydalanuvchi';
  document.getElementById('profilUsername').textContent=u?.username?'@'+u.username:'';
  document.getElementById('statFav').textContent=favIds().length;
  document.getElementById('statWatched').textContent=historyIds().length;
}

/* ---------- detail ---------- */
async function openDetail(id){
  showView('detail');
  document.getElementById('detailTitle').textContent='Yuklanmoqda...';
  document.getElementById('detailDesc').textContent='';
  document.getElementById('detailMeta').textContent='';
  document.getElementById('epGrid').innerHTML='';
  try{
    const d=await fetchJSON(`${API}/animes/${id}?user_id=${getUid()}`);
    document.getElementById('detailImg').src=posterUrl(d);
    document.getElementById('detailTitle').textContent=d.title;
    const typeLabel=d.media_type==='film'?'Film':'Serial';
    document.getElementById('detailMeta').textContent=`${typeLabel} • ${d.year||''} • ${d.genre||''} • 👁 ${formatViews(d.views)}`;
    document.getElementById('detailDesc').textContent=d.description||'';
    const favBtn2=document.getElementById('detailFav');
    favBtn2.classList.toggle('active',isFav(d.id));
    favBtn2.textContent=isFav(d.id)?'♥':'♡';
    favBtn2.onclick=()=>{const active=toggleFav(d.id);favBtn2.classList.toggle('active',active);favBtn2.textContent=active?'♥':'♡';};
    const grid=document.getElementById('epGrid');grid.innerHTML='';
    (d.episodes||[]).forEach(ep=>{
      const b=document.createElement('button');b.className='ep-btn';b.textContent=`${ep.episode_number}-qism`;
      b.addEventListener('click',()=>sendEp(ep.id,d.id));
      grid.appendChild(b);
    });
    if(!d.episodes||!d.episodes.length){grid.innerHTML='<div class="empty-msg">Epizodlar hali qoʻshilmagan</div>';}
  }catch(e){document.getElementById('detailTitle').textContent='Xatolik yuz berdi';}
}
document.getElementById('detailBack').addEventListener('click',()=>{showView('home');renderAllGrid();});

function sendEp(eid,animeId){
  const uid=getUid();
  fetch(`${API}/send_episode`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:uid,episode_id:eid})})
    .then(r=>r.json()).then(res=>{
      if(res.error){tg?.showAlert?tg.showAlert('Xatolik: '+res.error):alert('Xatolik: '+res.error);return;}
      if(animeId)pushHistory(animeId);
      tg?.showAlert?tg.showAlert('✅ Epizod botga yuborildi'):alert('✅ Epizod botga yuborildi');
    }).catch(()=>{tg?.showAlert?tg.showAlert('Tarmoq xatoligi'):alert('Tarmoq xatoligi');});
}

/* ---------- access control ---------- */
function showBlockView(n){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+n).classList.add('active');
  document.querySelector('.tabbar').style.display='none';
}
function renderSubscribeChannels(channels){
  const wrap=document.getElementById('subChannels');wrap.innerHTML='';
  (channels||[]).forEach(ch=>{
    const b=document.createElement('button');
    b.className='sub-channel-btn';
    b.textContent='📢 '+ch.name;
    b.addEventListener('click',()=>{tg?.openTelegramLink?tg.openTelegramLink(ch.url):window.open(ch.url,'_blank');});
    wrap.appendChild(b);
  });
}
async function checkAccess(){
  try{
    const status=await fetchJSON(`${API}/check_access?user_id=${getUid()}`);
    if(status.maintenance){showBlockView('maintenance');return false;}
    if(!status.subscribed){renderSubscribeChannels(status.channels);showBlockView('subscribe');return false;}
    document.querySelector('.tabbar').style.display='';
    return true;
  }catch(e){
    document.querySelector('.tabbar').style.display='';
    return true;
  }
}
document.getElementById('subCheckBtn').addEventListener('click',async()=>{const ok=await checkAccess();if(ok){showView('home');init();}});
document.getElementById('maintenanceRetry').addEventListener('click',async()=>{const ok=await checkAccess();if(ok){showView('home');init();}});

/* ---------- events ---------- */
document.getElementById('searchInput').addEventListener('input',renderAllGrid);
document.getElementById('segmented').addEventListener('click',(e)=>{
  const b=e.target.closest('.seg-btn');if(!b)return;
  document.querySelectorAll('.seg-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');ACTIVE_TYPE=b.dataset.type;renderAllGrid();
});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const v=t.dataset.view;showView(v);
  if(v==='favorites')renderFavorites();
  if(v==='profil')renderProfil();
}));
document.getElementById('bellBtn').addEventListener('click',()=>{tg?.showAlert?tg.showAlert('Hozircha yangi bildirishnomalar yoʻq'):alert('Hozircha yangi bildirishnomalar yoʻq');});
document.getElementById('profilBotLink').addEventListener('click',()=>{tg?.close?tg.close():history.back();});
document.getElementById('profilClearHistory').addEventListener('click',()=>{
  localStorage.removeItem('anifilm_history');
  if(document.getElementById('view-profil').classList.contains('active'))renderProfil();
  document.getElementById('continueSection').style.display='none';
});

/* ---------- init ---------- */
async function init(){
  const ok=await checkAccess();
  if(!ok)return;
  const uid=getUid();
  try{
    ALL_ANIME=await fetchJSON(`${API}/animes?user_id=${uid}`);
    renderHome(ALL_ANIME);
  }catch(e){
    document.getElementById('heroTitle').textContent='Malumot yuklanmadi';
  }
}
init();
</script>
