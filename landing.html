::selection{background:var(--tq);color:#06231f}

/* ===== Pleyer boshqaruvi: koʻrilgan joy chizigʻi, kengaytirish, yuklab olish ===== */
.pl video{object-fit:contain;cursor:pointer}
.pc,.pc-big,.pc-spin,.pc-mini{-webkit-user-select:none;user-select:none}
.pc{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:46px clamp(10px,1.6vw,20px) clamp(8px,1vw,14px);background:linear-gradient(0deg,rgba(6,9,28,.94),rgba(6,9,28,.62) 55%,rgba(6,9,28,0));opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .22s,transform .22s}
.pl.ui .pc{opacity:1;transform:none;pointer-events:auto}
.pl.fz{max-height:none;border-radius:0}
.pl.fz:not(.ui){cursor:none}
.pc-line{position:relative;display:flex;align-items:center;height:24px;cursor:pointer;touch-action:none}
.pc-trk{position:relative;width:100%;height:5px;border-radius:3px;background:rgba(255,255,255,.24);transition:height .12s}
.pc-buf,.pc-fil{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:inherit}
.pc-buf{background:rgba(255,255,255,.36)}
.pc-fil{background:var(--sf)}
.pc-thm{position:absolute;top:50%;left:0;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:var(--sf);box-shadow:0 0 0 4px rgba(255,185,56,.28);transform:scale(0);transition:transform .12s}
.pl:not(.dr) .pc-fil{transition:width .25s linear}
.pl:not(.dr) .pc-thm{transition:transform .12s,left .25s linear}
.pc-line:focus-visible .pc-trk,.pl.dr .pc-trk{height:9px}
.pc-line:focus-visible .pc-thm,.pl.dr .pc-thm,.pl.pz .pc-thm{transform:scale(1)}

['play','pause','ended','emptied'].forEach(n=>on(v,n,()=>{st();wait();show()}));
['waiting','seeking','seeked','playing','canplay','loadeddata','stalled','emptied'].forEach(n=>on(v,n,wait));
on(v,'playing',()=>{init=false;wait()});on(v,'error',()=>{init=false;wait()});
on(v,'volumechange',()=>{vol();sv('af_vol',v.volume);sv('af_mute',v.muted)});
/* chiziq: bosib yoki sudrab surish (video faqat qoʻyib yuborilganda suriladi) */
on(line,'pointerdown',ev=>{if(ev.button||!D())return;drag=true;dr=frac(ev.clientX);pl.classList.add('dr');try{line.setPointerCapture(ev.pointerId)}catch(x){}draw(dr);tipAt(ev.clientX);paint()});
on(line,'pointermove',ev=>{tipAt(ev.clientX);if(drag){dr=frac(ev.clientX);draw(dr);paint()}});
on(line,'pointerup',()=>{if(!drag)return;drag=false;pl.classList.remove('dr');const d=D();if(d)v.currentTime=dr*d;paint();show()});
on(line,'pointercancel',()=>{drag=false;pl.classList.remove('dr');paint()});
on(line,'keydown',ev=>{const d=D(),k=ev.key;if(!d)return;let t=null;if(k==='ArrowDown')t=v.currentTime-10;else if(k==='ArrowUp')t=v.currentTime+10;else if(k==='Home')t=0;else if(k==='End')t=d-1;if(t!==null){v.currentTime=Math.min(d,Math.max(0,t));ev.preventDefault();ev.stopPropagation()}});
/* tugmalar */
on(pp,'click',tog);on(big,'click',tog);
on(mu,'click',()=>{v.muted=!v.muted;if(!v.muted&&v.volume===0)v.volume=.5});
on(vo,'input',()=>{v.volume=+vo.value;v.muted=+vo.value===0});
on(wd,'click',wideTog);on(fb,'click',fsTog);
if(!(pl.requestFullscreen||pl.webkitRequestFullscreen||v.webkitEnterFullscreen))fb.hidden=true;
on(document,'fullscreenchange',fz);on(document,'webkitfullscreenchange',fz);
/* video ustida: bosish — ijro/pauza, ikki marta bosish — toʻliq ekran */
on(v,'pointerdown',ev=>{tp=ev.pointerType==='touch'&&!pl.classList.contains('ui')});
on(v,'click',()=>{clearTimeout(ck);if(tp){tp=false;show();return}ck=setTimeout(tog,230);show()});
on(v,'dblclick',()=>{clearTimeout(ck);fsTog()});
/* boshqaruv paneli: sichqoncha/barmoq harakatlanganda koʻrinadi, 3 soniyadan soʻng yashirinadi */
on(pl,'pointermove',show);on(pl,'pointerdown',show);on(pl,'keydown',show);on(pl,'focusin',show);
on(pl,'pointerleave',ev=>{if(ev.pointerType==='mouse'&&!v.paused&&!drag){clearTimeout(hid);hid=setTimeout(()=>pl.classList.remove('ui'),700)}});
const v0=+ls('af_vol',1);v.volume=v0>=0&&v0<=1?v0:1;v.muted=!!ls('af_mute',false);
vol();wide(!!ls('af_wide',false));st();paint();wait();fz();
const p0=v.play();if(p0&&p0.then)p0.then(()=>{init=false;wait()},()=>{init=false;wait();st();show()});
return{tog,fs:fsTog,wide:wideTog,show}}
/* ---------- tomosha sahifasi ---------- */
async function watch(aid,eid){const ap=$('#app');ap.innerHTML='<div class="wrap pad dm">Yuklanmoqda…</div>';const d=await getJ('/api/public/animes/'+aid),eps=(d&&d.episodes)||[];
if(!eps.length){ap.innerHTML=empty('Bu animening qismlari saytda hali mavjud emas',`<a class="btn" href="${BOT}?start=anime_${aid}">Botda koʻrish</a>`);return}
const p=PROG[aid];let i=eps.findIndex(e=>e.id==eid);if(i<0){i=p?eps.findIndex(e=>e.id==p.e):-1;if(i<0)i=Math.max(0,eps.findIndex(e=>!e.locked))}
const e=eps[i],pv=eps[i-1],nx=eps[i+1],seen=(p&&p.s)||[];
const lock=`<div class="ov"><div><h2 class="disp">Premium qism</h2><p class="dm">Bu qism hozircha faqat Premium foydalanuvchilar uchun.</p><br><a class="btn" href="${BOT}?start=anime_${aid}">Botda ochish</a></div></div>`;
ap.innerHTML=`<div class="wrap wg"><div class="wm"><div class="pl" id="pl">${e.locked?lock:`<video id="v" playsinline autoplay preload="metadata" src="/stream/${e.id}?site=1"></video>${ctl(e,d)}`}</div><h1 class="disp ttl">${esc(d.title)}</h1><div class="meta"><span>${e.n}-qism</span>${d.views?`<span class="vwn" data-v="${d.views}">${fmt(d.views)} marta koʻrilgan</span>`:''}<a href="/anime/${aid}" style="color:var(--tq)">Anime haqida</a></div><div class="tg"><label><input type="checkbox" id="ta"${ls('af_auto',true)?' checked':''}>Avto keyingi qism</label><label><input type="checkbox" id="tl">Chiroqni oʻchirish</label><button class="btn g" onclick="share()" style="margin:0">Ulashish</button></div>${dlp(e,d)}<div class="bar">${pv?`<a class="btn g" href="/watch/${aid}/${pv.id}">‹ Oldingi</a>`:''}${nx?`<a class="btn" href="/watch/${aid}/${nx.id}">Keyingi ›</a>`:''}<select id="sp" aria-label="Tezlik">${[.75,1,1.25,1.5,2].map(x=>`<option value="${x}">${x}x</option>`).join('')}</select><button class="btn g" id="sk">+85 soniya</button></div></div><div class="eps">${eps.map(x=>`<a class="ep${x.id==e.id?' on':''}${seen.includes(x.id)?' seen':''}${x.locked?' lk':''}" href="/watch/${aid}/${x.id}">${x.n}</a>`).join('')}</div></div>`;
document.title=`${d.title} · ${e.n}-qism — AniFilm.uz`;
if(TOKEN)api('/api/site/history',{method:'POST',body:JSON.stringify({anime_id:Number(aid)})}).catch(()=>{});
const v=$('#v');if(!v){$('#sp').disabled=true;$('#sk').disabled=true;return}v.addEventListener('playing',()=>countView(aid),{once:true});
let P=null;try{P=pctl(v,$('#pl'),$('.wg'))}catch(x){console.error(x);v.controls=true;document.querySelectorAll('#pl .pc,#pl .pc-big,#pl .pc-spin,#pl .pc-mini').forEach(n=>n.remove())}
$('#sp').value=ls('af_speed',1);
const save=end=>{const s=new Set((PROG[aid]||{}).s||[]);if(end||(v.duration&&v.currentTime>v.duration*.9))s.add(e.id);PROG[aid]={e:e.id,n:e.n,t:end?0:v.currentTime,d:v.duration||0,u:Date.now(),s:[...s]};sv('af_prog',PROG)};
v.onloadedmetadata=()=>{v.playbackRate=ls('af_speed',1);if(p&&p.e==e.id&&p.t>5&&p.t<v.duration-20)v.currentTime=p.t};
let lt=0;v.ontimeupdate=()=>{const n=Date.now();if(n-lt>4000){lt=n;save()}};v.onpause=()=>save();
v.onended=()=>{save(true);if(nx&&!nx.locked&&ls('af_auto',true)){const o=document.createElement('div');o.className='ov';o.innerHTML=`<div><h2 class="disp">Keyingi: ${nx.n}-qism</h2><p class="dm">5 soniyadan soʻng boshlanadi</p><br><a class="btn" href="/watch/${aid}/${nx.id}">Hozir</a><button class="btn g" id="cn">Bekor qilish</button></div>`;$('#pl').appendChild(o);HT=setTimeout(()=>{nav(`/watch/${aid}/${nx.id}`)},5000);$('#cn').onclick=()=>{clearTimeout(HT);o.remove()}}};
v.onerror=()=>{$('#pl').insertAdjacentHTML('beforeend',`<div class="ov"><div><h2 class="disp">Video ochilmadi</h2><p class="dm">Birozdan soʻng qayta urinib koʻring yoki botda tomosha qiling.</p><br><button class="btn g" onclick="go()">Qayta urinish</button><a class="btn" href="${BOT}?start=anime_${aid}">Botda koʻrish</a></div></div>`)};
$('#sp').onchange=ev=>{sv('af_speed',+ev.target.value);v.playbackRate=+ev.target.value};$('#sk').onclick=()=>{v.currentTime+=85};$('#ta').onchange=ev=>sv('af_auto',ev.target.checked);$('#tl').onchange=ev=>document.body.classList.toggle('lo',ev.target.checked);
document.onkeydown=ev=>{if(/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)||ev.ctrlKey||ev.metaKey||ev.altKey)return;const k=ev.key;
if(k==='ArrowRight'){v.currentTime+=10;P&&P.show()}else if(k==='ArrowLeft'){v.currentTime-=10;P&&P.show()}else if(k==='m'||k==='M')v.muted=!v.muted;
else if(P&&(k==='f'||k==='F'))P.fs();else if(P&&(k==='t'||k==='T'))P.wide();else if(P&&(k==='k'||k==='K'||(k===' '&&!/^(BUTTON|A)$/.test(ev.target.tagName)))){P.tog();ev.preventDefault()}}}
/* ---------- qidiruv ---------- */
function S(o){$('#srch').classList.toggle('on',!!o);if(o){$('#si').value='';sr('');setTimeout(()=>$('#si').focus(),50)}}
function sr(q){q=q.trim().toLowerCase();const L=q?A.filter(a=>(a.title||'').toLowerCase().includes(q)).slice(0,8):[];
$('#sres').innerHTML=!q?'<p class="dm">Anime nomini yozing</p>':L.length?L.map(a=>`<a href="/anime/${a.id}" onclick="S(0)">${po(a)}<div><b>${esc(a.title)}</b><br><small class="dm">${esc(a.year||'')}</small></div></a>`).join('')+`<a href="/catalog?q=${encodeURIComponent(q)}" onclick="S(0)"><b style="color:var(--tq)">Barcha natijalar</b></a>`:'<p class="dm">Hech narsa topilmadi</p>'}
/* ---------- hisob va sevimlilar ---------- */
function auth(){$('#au').classList.add('on');authView()}
function authClose(){$('#au').classList.remove('on');if(AM==='forgot'){AM='login';FPM=''}}
async function authView(){const b=$('#aub'),x='<button class="ib" onclick="authClose()" aria-label="Yopish">✕</button>';
if(AM==='forgot'){b.innerHTML=`<div class="sh"><h2 class="disp">Parolni tiklash</h2>${x}</div>`+(FPM?`<p>${esc(FPM)}</p><p class="dm">Xat kelmasa, «Spam» papkasini ham tekshiring. Havola 1 soat amal qiladi.</p><br><button class="btn" onclick="AM='login';FPM='';authView()">Kirishga qaytish</button>`:`<p class="dm">Roʻyxatdan oʻtgan emailingizni kiriting — parolni tiklash havolasini yuboramiz.</p><input class="f" id="a1" type="email" placeholder="Email" autocomplete="email" onkeydown="if(event.key==='Enter')authForgot()"><p class="er" id="aer"></p><button class="btn" onclick="authForgot()">Havola yuborish</button><button class="btn g" onclick="AM='login';authView()">Orqaga</button>`);return}
if(TOKEN){let u=null;try{const r=await api('/api/site/me');if(r.ok)u=(await r.json()).user}catch(e){}
if(u){b.innerHTML=`<div class="sh"><h2 class="disp">Profil</h2>${x}</div><p><b>${esc(u.display_name||u.email||u.phone)}</b></p><p class="dm">${esc(u.email||u.phone||'')}</p><br><a class="btn" href="/favorites" onclick="authClose()">Sevimlilar (${FAV.size})</a><button class="btn g" onclick="logout();authView()">Chiqish</button>`;return}}
const L=AM==='login',t=L?'Kirish':'Roʻyxatdan oʻtish';
b.innerHTML=`<div class="sh"><h2 class="disp">${t}</h2>${x}</div>`+(L?'<input class="f" id="a1" placeholder="Email yoki telefon" autocomplete="username"><input class="f" id="a2" type="password" placeholder="Parol" autocomplete="current-password"><a href="#" class="dm" style="display:inline-block;padding:10px 0;text-decoration:underline" onclick="forgot();return false">Parolni unutdim?</a>':'<input class="f" id="a1" type="email" placeholder="Email" autocomplete="email"><input class="f" id="a3" placeholder="Ismingiz" autocomplete="name"><input class="f" id="a2" type="password" placeholder="Parol (kamida 6 ta belgi)" autocomplete="new-password">')+`<p class="er" id="aer"></p><button class="btn" onclick="authGo()">${t}</button><button class="btn g" onclick="AM=AM==='login'?'reg':'login';authView()">${L?'Hisob yaratish':'Hisobim bor'}</button>`}
async function authGo(){const e=$('#aer'),v=i=>($('#'+i)?$('#'+i).value:'').trim(),L=AM==='login';e.textContent='';
const body=L?{identifier:v('a1'),password:$('#a2').value}:{email:v('a1'),phone:'',display_name:v('a3'),password:$('#a2').value};
if(L?!body.identifier||!body.password:!body.email||body.password.length<6){e.textContent=L?'Barcha maydonlarni toʻldiring':'Email va kamida 6 belgili parol kiriting';return}
try{const r=await fetch('/api/site/'+(L?'login':'register'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok){e.textContent=d.error||'Xatolik yuz berdi';return}
TOKEN=d.token;sv('af_token',TOKEN);await loadFav();authView()}catch(x){e.textContent='Tarmoq xatosi, qayta urinib koʻring'}}
function forgot(){AM='forgot';FPM='';auth()}
async function authForgot(){if(BUSY)return;const e=$('#aer'),em=($('#a1').value||'').trim().toLowerCase();e.textContent='';
if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){e.textContent='Email manzilini toʻgʻri kiriting';return}
BUSY=1;
try{const r=await fetch('/api/site/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em})}),d=await r.json();
if(!r.ok){e.textContent=d.error||'Xatolik yuz berdi';return}
FPM=d.message||'Agar bu email roʻyxatdan oʻtgan boʻlsa, tiklash havolasi yuborildi.';authView()}catch(x){e.textContent='Tarmoq xatosi, qayta urinib koʻring'}finally{BUSY=0}}
function resetPage(){const tk=new URLSearchParams(location.search).get('token')||'';document.title='Yangi parol — AniFilm.uz';
$('#app').innerHTML=`<div class="wrap pad"><div class="box" style="margin:0 auto">`+(tk?`<h1 class="disp ttl" style="margin-top:0">Yangi parol</h1><p class="dm">Hisobingiz uchun yangi parol oʻrnating.</p><input class="f" id="rp1" type="password" placeholder="Yangi parol (kamida 6 ta belgi)" autocomplete="new-password"><input class="f" id="rp2" type="password" placeholder="Parolni takrorlang" autocomplete="new-password" onkeydown="if(event.key==='Enter')resetGo()"><p class="er" id="rer"></p><button class="btn" id="rb" onclick="resetGo()">Parolni oʻrnatish</button><br><a href="#" class="dm" style="display:inline-block;padding:10px 0;text-decoration:underline" onclick="forgot();return false">Havolani qayta soʻrash</a>`:`<h1 class="disp ttl" style="margin-top:0">Havola notoʻgʻri</h1><p class="dm">Parolni tiklash havolasi toʻliq emas yoki eskirgan.</p><br><button class="btn" onclick="forgot()">Havolani qayta soʻrash</button>`)+`</div></div>`}
async function resetGo(){if(BUSY)return;const e=$('#rer'),p=$('#rp1').value,tk=new URLSearchParams(location.search).get('token')||'';e.textContent='';
if(p.length<6){e.textContent='Parol kamida 6 ta belgidan iborat boʻlishi kerak';return}
if(p!==$('#rp2').value){e.textContent='Parollar bir xil emas';return}
BUSY=1;$('#rb').disabled=true;
try{const r=await fetch('/api/site/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:tk,password:p})}),d=await r.json();
if(!r.ok){e.textContent=d.error||'Xatolik yuz berdi';return}
history.replaceState(null,'','/');
$('#app').innerHTML=`<div class="wrap pad"><div class="box" style="margin:0 auto"><h1 class="disp ttl" style="margin-top:0">Parol oʻzgartirildi</h1><p class="dm">Endi yangi parol bilan hisobingizga kirishingiz mumkin.</p><br><button class="btn" onclick="nav('/');AM='login';auth()">Kirish</button></div></div>`}catch(x){e.textContent='Tarmoq xatosi, qayta urinib koʻring'}finally{BUSY=0;const b=$('#rb');if(b)b.disabled=false}}
function logout(){TOKEN=null;try{localStorage.removeItem('af_token')}catch(e){}FAV=new Set();sv('af_fav_cache',[])}
async function loadFav(){if(!TOKEN)return;try{const r=await api('/api/site/favorites');if(r.ok){FAV=new Set((await r.json()).map(a=>a.id));sv('af_fav_cache',[...FAV])}}catch(e){}}
async function toggleFav(id,btn){if(!TOKEN){auth();return}try{const r=await api('/api/site/favorite',{method:'POST',body:JSON.stringify({anime_id:id})});if(r.ok){const d=await r.json();d.active?FAV.add(id):FAV.delete(id);sv('af_fav_cache',[...FAV]);if(btn)btn.classList.toggle('on',d.active)}}catch(e){}}
async function favs(){const ap=$('#app');if(!TOKEN){ap.innerHTML=empty('Sevimlilarni koʻrish uchun hisobingizga kiring','<button class="btn" onclick="auth()">Kirish</button>');return}
ap.innerHTML='<div class="wrap pad dm">Yuklanmoqda…</div>';const L=(await getAuth('/api/site/favorites'))||[];
ap.innerHTML=`<div class="wrap"><h1 class="disp ttl">Sevimlilar</h1>${L.length?`<div class="grid">${L.map(a=>card(a)).join('')}</div>`:'<p class="dm">Hali sevimlilar yoʻq. Anime sahifasidagi «Sevimli» tugmasini bosing.</p>'}</div>`}
function watched(){const ap=$('#app'),L=Object.entries(PROG).map(([id,p])=>({a:A.find(x=>x.id==id),p})).filter(x=>x.a).sort((x,y)=>(y.p.u||0)-(x.p.u||0));
document.title='Koʻrilganlar — AniFilm.uz';
ap.innerHTML=`<div class="wrap"><div class="sh"><h1 class="disp ttl">Koʻrilganlar</h1>${L.length?'<button class="btn g" onclick="clearWatched()">Tozalash</button>':''}</div>${L.length?`<div class="grid">${L.map(({a,p})=>{const n=(p.s||[]).length,t=+a.episode_count||+a.total_episodes||0,pc=t?Math.min(100,Math.round(n/t*100)):0;return`<a class="c" href="/watch/${a.id}/${p.e}">${po(a,`<span class="bd r">${p.n}-qism</span>`)}<h3>${esc(a.title)}</h3><small class="sub"><span>${n?n+(t?'/'+t:'')+' qism koʻrildi':'Boshlangan'}</span>${vw(a)}</small>${t?`<i class="pr"><b style="width:${pc}%"></b></i>`:''}</a>`}).join('')}</div>`:'<p class="dm">Hali hech narsa koʻrilmagan. Biror qismni oching — shu yerda koʻrinadi.</p>'}</div>`}
function clearWatched(){if(!confirm('Koʻrilganlar roʻyxati tozalansinmi?'))return;PROG={};sv('af_prog',PROG);watched()}
async function getAuth(u){try{const r=await api(u);return r.ok?await r.json():null}catch(e){return null}}
/* ---------- ishga tushirish ---------- */
document.querySelectorAll('[data-i]').forEach(e=>{e.innerHTML=ic(e.dataset.i)+(e.dataset.l?`<span>${e.dataset.l}</span>`:'')});
addEventListener('popstate',go);
addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if($('#srch').classList.contains('on'))S(0);if($('#au').classList.contains('on'))authClose()});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="/"]');if(!a||e.defaultPrevented||e.button||e.metaKey||e.ctrlKey||e.shiftKey||a.target||a.hasAttribute('download')||a.getAttribute('href').startsWith('//'))return;e.preventDefault();nav(a.getAttribute('href'))});
(async()=>{const[r,c,b]=await Promise.all([getJ('/api/public/animes'),getJ('/api/public/categories'),getJ('/api/public/banners')]);
if(Array.isArray(r)&&r.length){A=r;CATS=Array.isArray(c)?c:[];BAN=Array.isArray(b)?b:[]}else{demo=true;A=DEMO;CATS=['Aksiya','Drama','Komediya','Fantastika']}
loadFav();go()})();
